<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise API Console</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #f4f4f5;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    img { display: block; max-width: 100%; }
    :root {
      --surface: #ffffff;
      --elevated: #f0f0f1;
      --input: #f7f7f8;
      --line: #e4e4e7;
      --muted: #71717a;
      --soft: #a1a1aa;
      --accent: #ff4f00;
      --accent-soft: rgba(255, 79, 0, 0.08);
      --ok: #16803c;
      --warn: #9a5b00;
      --bad: #b42318;
      --radius: 8px;
    }
    .app {
      display: grid;
      grid-template-columns: 300px minmax(420px, 1fr) 390px;
      height: 100vh;
      overflow: hidden;
    }
    .panel {
      background: var(--surface);
      border-right: 1px solid var(--line);
      min-height: 0;
      overflow: auto;
    }
    .panel.chat { border-right: 0; border-left: 1px solid var(--line); }
    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--line);
      padding: 16px;
    }
    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .brand-title { font-weight: 800; letter-spacing: -0.03em; }
    .brand-title span { color: var(--accent); }
    .tiny { color: var(--muted); font-size: 12px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--input);
      color: #111;
      outline: none;
    }
    .input, .select { height: 36px; padding: 7px 10px; }
    .textarea { min-height: 88px; resize: vertical; padding: 10px; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
    .stack { padding: 14px 16px 20px; display: grid; gap: 12px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 4px 9px;
      font-size: 12px;
      text-transform: capitalize;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 34px;
      border-radius: var(--radius);
      padding: 7px 11px;
      background: var(--elevated);
      border: 1px solid var(--line);
      color: #222;
      font-weight: 600;
      font-size: 13px;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { color: var(--bad); }
    .btn:disabled { cursor: wait; opacity: 0.62; }
    .main {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(244,244,245,0.96);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toolbar-title { font-weight: 800; letter-spacing: -0.02em; }
    .status { color: var(--muted); font-size: 12px; }
    .grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      text-align: left;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    button.card { padding: 0; }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.09);
    }
    .media {
      aspect-ratio: 3 / 4;
      background: var(--elevated);
      position: relative;
      overflow: hidden;
    }
    .media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s;
    }
    .media .gif { opacity: 0; }
    .card:hover .media .gif { opacity: 1; }
    .card:hover .media .thumb { opacity: 0; }
    .card-body { padding: 10px 11px 12px; }
    .card-name {
      min-height: 34px;
      font-weight: 700;
      text-transform: capitalize;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .tag-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag {
      border-radius: 5px;
      background: var(--elevated);
      color: var(--muted);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 72px 20px;
      text-align: center;
      color: var(--muted);
    }
    .chat-log {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 11px;
      background: var(--surface);
    }
    .message.user {
      background: #111;
      color: #fff;
      border-color: #111;
      margin-left: 28px;
    }
    .message.assistant { margin-right: 18px; }
    .message-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .message.user .message-title { color: rgba(255,255,255,0.65); }
    .notice {
      border-radius: var(--radius);
      padding: 8px 9px;
      font-size: 12px;
      margin-top: 8px;
      background: #fff6e6;
      color: var(--warn);
      border: 1px solid #ffdca3;
    }
    .assumptions {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .mini-list { display: grid; gap: 8px; margin-top: 9px; }
    .mini-card {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 9px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 7px;
      background: #fff;
    }
    .mini-card img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--elevated);
    }
    .mini-title { font-weight: 700; text-transform: capitalize; }
    .mini-meta { color: var(--muted); font-size: 12px; text-transform: capitalize; }
    .chat-composer {
      position: sticky;
      bottom: 0;
      background: rgba(255,255,255,0.96);
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.45);
      padding: 16px;
    }
    .modal.open { display: grid; }
    .modal-panel {
      width: min(720px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
    }
    .modal-title { margin: 0; text-transform: capitalize; font-size: 20px; }
    .modal-content { padding: 14px 16px 18px; display: grid; gap: 14px; }
    .modal-gif {
      width: 100%;
      max-height: 330px;
      object-fit: contain;
      background: var(--elevated);
      border-radius: var(--radius);
    }
    .meta-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .meta {
      background: var(--elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 10px;
      text-transform: capitalize;
    }
    .section-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .steps { margin: 0; padding-left: 20px; color: #333; }
    .steps li { margin: 0 0 7px; }
    @media (max-width: 1080px) {
      .app { grid-template-columns: 280px 1fr; }
      .panel.chat { grid-column: 1 / -1; height: 46vh; border-left: 0; border-top: 1px solid var(--line); }
      .main { height: 54vh; }
    }
    @media (max-width: 720px) {
      .app { display: block; height: auto; overflow: visible; }
      .panel, .main, .panel.chat { height: auto; max-height: none; overflow: visible; border-left: 0; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; gap: 9px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="panel-header">
        <div class="brand">
          <div class="brand-title">Exercise<span>API</span></div>
          <div class="tiny" id="health-state">Not checked</div>
        </div>
        <div class="field">
          <label for="api-base">API base URL</label>
          <input class="input" id="api-base" autocomplete="off" />
        </div>
        <div class="btn-row">
          <button class="btn primary" id="save-api">Save API</button>
          <button class="btn" id="check-health">Health</button>
        </div>
      </div>
      <div class="stack">
        <div class="field">
          <label for="limit">Page size</label>
          <select class="select" id="limit">
            <option>10</option>
            <option selected>20</option>
            <option>50</option>
            <option>100</option>
          </select>
        </div>
        <div class="field">
          <label>Category</label>
          <div class="chip-row" id="category-chips"></div>
        </div>
        <div class="field">
          <label>Body part</label>
          <div class="chip-row" id="body-part-chips"></div>
        </div>
        <div class="field">
          <label>Equipment</label>
          <div class="chip-row" id="equipment-chips"></div>
        </div>
        <div class="field">
          <label for="muscle-group">Muscle group</label>
          <input class="input" id="muscle-group" placeholder="triceps, biceps, back" />
        </div>
        <div class="field">
          <label for="target">Target</label>
          <input class="input" id="target" placeholder="pectorals, abs, delts" />
        </div>
        <div class="btn-row">
          <button class="btn primary" id="apply-filters">Apply filters</button>
          <button class="btn" id="clear-filters">Clear</button>
          <button class="btn" id="random-exercise">Random</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <div class="toolbar-title">Catalog</div>
          <div class="status" id="catalog-status">Load exercises from the REST API.</div>
        </div>
        <div class="btn-row">
          <button class="btn" id="prev-page">Prev</button>
          <span class="status" id="page-state">Page 1</span>
          <button class="btn" id="next-page">Next</button>
        </div>
      </div>
      <div class="grid" id="exercise-grid"></div>
    </main>

    <section class="panel chat">
      <div class="panel-header">
        <div class="brand">
          <div class="brand-title">LLM<span>Chat</span></div>
          <div class="tiny" id="session-state">No session</div>
        </div>
        <div class="btn-row">
          <button class="btn" id="new-session">New session</button>
          <button class="btn danger" id="clear-chat">Clear local chat</button>
        </div>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-composer">
        <div class="field">
          <label for="chat-input">Message</label>
          <textarea class="textarea" id="chat-input" placeholder="Find body-weight chest exercises"></textarea>
        </div>
        <button class="btn primary" id="send-chat">Send</button>
      </div>
    </section>
  </div>

  <div class="modal" id="exercise-modal" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="btn" id="close-modal">Close</button>
      </div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script>
    const keys = {
      apiBase: "exerciseApiUi.apiBase",
      filters: "exerciseApiUi.filters",
      page: "exerciseApiUi.page",
      limit: "exerciseApiUi.limit",
      sessionId: "exerciseApiUi.sessionId",
      transcript: "exerciseApiUi.transcript"
    };

    const state = {
      apiBase: localStorage.getItem(keys.apiBase) || defaultApiBase(),
      filters: readJson(keys.filters, {}),
      page: Number(localStorage.getItem(keys.page) || "1"),
      limit: Number(localStorage.getItem(keys.limit) || "20"),
      totalPages: 0,
      sessionId: localStorage.getItem(keys.sessionId) || "",
      transcript: readJson(keys.transcript, []),
      exercisesById: new Map()
    };

    const $ = (id) => document.getElementById(id);

    function defaultApiBase() {
      return location.protocol === "http:" || location.protocol === "https:"
        ? location.origin
        : "http://127.0.0.1:8000";
    }

    function readJson(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function writeJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function endpoint(path) {
      return `${state.apiBase.replace(/\/$/, "")}${path}`;
    }

    function cap(value) {
      return String(value || "").replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    async function api(path, options = {}) {
      const response = await fetch(endpoint(path), {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          detail = (await response.json()).detail || detail;
        } catch {}
        throw new Error(`${response.status} ${detail}`);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function persistUiState() {
      localStorage.setItem(keys.apiBase, state.apiBase);
      localStorage.setItem(keys.page, String(state.page));
      localStorage.setItem(keys.limit, String(state.limit));
      writeJson(keys.filters, state.filters);
      if (state.sessionId) localStorage.setItem(keys.sessionId, state.sessionId);
      else localStorage.removeItem(keys.sessionId);
      writeJson(keys.transcript, state.transcript);
    }

    async function loadLookups() {
      const [categories, bodyParts, equipment] = await Promise.all([
        api("/categories"),
        api("/body-parts"),
        api("/equipment")
      ]);
      renderChips("category-chips", "category", categories);
      renderChips("body-part-chips", "body_part", bodyParts);
      renderChips("equipment-chips", "equipment", equipment);
    }

    function renderChips(containerId, field, values) {
      $(containerId).innerHTML = values.map((value) => `
        <button class="chip ${state.filters[field] === value ? "active" : ""}"
          data-filter-field="${field}" data-filter-value="${escapeHtml(value)}">
          ${escapeHtml(value)}
        </button>
      `).join("");
    }

    function collectTextFilters() {
      state.filters.muscle_group = $("muscle-group").value.trim();
      state.filters.target = $("target").value.trim();
      for (const field of ["muscle_group", "target"]) {
        if (!state.filters[field]) delete state.filters[field];
      }
    }

    function filterParams() {
      const params = new URLSearchParams({
        page: String(state.page),
        limit: String(state.limit)
      });
      for (const [key, value] of Object.entries(state.filters)) {
        if (value) params.set(key, value);
      }
      return params;
    }

    async function loadExercises() {
      collectTextFilters();
      persistUiState();
      $("catalog-status").textContent = "Loading exercises...";
      $("exercise-grid").innerHTML = `<div class="empty">Loading catalog rows from ${escapeHtml(state.apiBase)}</div>`;
      try {
        const page = await api(`/exercises?${filterParams().toString()}`);
        state.totalPages = page.totalPages;
        for (const exercise of page.data) state.exercisesById.set(exercise.id, exercise);
        renderExercises(page.data);
        $("catalog-status").textContent = `${page.total} matches`;
        $("page-state").textContent = `Page ${page.page} of ${Math.max(page.totalPages, 1)}`;
        $("prev-page").disabled = page.page <= 1;
        $("next-page").disabled = page.page >= page.totalPages;
      } catch (error) {
        $("catalog-status").textContent = "Catalog request failed";
        $("exercise-grid").innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderExercises(exercises) {
      if (!exercises.length) {
        $("exercise-grid").innerHTML = `<div class="empty">No exercises matched those filters.</div>`;
        return;
      }
      $("exercise-grid").innerHTML = exercises.map(exerciseCard).join("");
    }

    function exerciseCard(exercise) {
      return `
        <button class="card" data-exercise-id="${escapeHtml(exercise.id)}">
          <div class="media">
            <img class="thumb" src="${escapeHtml(exercise.image)}" alt="${escapeHtml(exercise.name)} thumbnail" loading="lazy">
            <img class="gif" src="${escapeHtml(exercise.gif_url)}" alt="${escapeHtml(exercise.name)} animation" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-name">${escapeHtml(exercise.name)}</div>
            <div class="tag-row">
              <span class="tag">${escapeHtml(exercise.category)}</span>
              <span class="tag">${escapeHtml(exercise.equipment)}</span>
              <span class="tag">${escapeHtml(exercise.target)}</span>
            </div>
          </div>
        </button>
      `;
    }

    async function showRandomExercise() {
      try {
        const exercise = await api("/exercises/random");
        state.exercisesById.set(exercise.id, exercise);
        openExercise(exercise);
      } catch (error) {
        $("catalog-status").textContent = error.message;
      }
    }

    function openExercise(exercise) {
      $("modal-title").textContent = cap(exercise.name);
      $("modal-content").innerHTML = `
        <img class="modal-gif" src="${escapeHtml(exercise.gif_url)}" alt="${escapeHtml(exercise.name)} animation">
        <div class="meta-grid">
          <div class="meta">Category: ${escapeHtml(exercise.category)}</div>
          <div class="meta">Body: ${escapeHtml(exercise.body_part)}</div>
          <div class="meta">Equipment: ${escapeHtml(exercise.equipment)}</div>
          <div class="meta">Target: ${escapeHtml(exercise.target)}</div>
          <div class="meta">Muscle: ${escapeHtml(exercise.muscle_group)}</div>
        </div>
        <div>
          <div class="section-title">Secondary muscles</div>
          <div class="tag-row">${exercise.secondary_muscles.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join("")}</div>
        </div>
        <div>
          <div class="section-title">Instructions</div>
          <ol class="steps">${exercise.instructions.map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ol>
        </div>
        <div class="tiny">${escapeHtml(exercise.attribution || "")}</div>
      `;
      $("exercise-modal").classList.add("open");
    }

    function renderTranscript() {
      if (!state.transcript.length) {
        $("chat-log").innerHTML = `<div class="message assistant"><div class="message-title">Assistant</div>Ask for exercises or a workout. The response will render catalog results and workout steps here.</div>`;
      } else {
        $("chat-log").innerHTML = state.transcript.map(renderMessage).join("");
      }
      $("session-state").textContent = state.sessionId ? `Session ${state.sessionId.slice(0, 8)}` : "No session";
    }

    function renderMessage(message) {
      if (message.role === "user") {
        return `<div class="message user"><div class="message-title">You</div>${escapeHtml(message.text)}</div>`;
      }
      const payload = message.payload || {};
      const warnings = (payload.warnings || []).map((item) => `<div class="notice">${escapeHtml(item)}</div>`).join("");
      const assumptions = (payload.assumptions || []).length
        ? `<div class="assumptions">Assumptions: ${escapeHtml(payload.assumptions.join("; "))}</div>`
        : "";
      const results = renderMiniExercises(payload.results || []);
      const workout = renderWorkout(payload.workout);
      return `
        <div class="message assistant">
          <div class="message-title">Assistant</div>
          <div>${escapeHtml(payload.answer || message.text || "")}</div>
          ${warnings}
          ${assumptions}
          ${workout}
          ${results}
        </div>
      `;
    }

    function renderMiniExercises(exercises) {
      if (!exercises.length) return "";
      for (const exercise of exercises) state.exercisesById.set(exercise.id, exercise);
      return `<div class="mini-list">${exercises.map((exercise) => `
        <button class="mini-card" data-exercise-id="${escapeHtml(exercise.id)}">
          <img src="${escapeHtml(exercise.image)}" alt="">
          <span>
            <span class="mini-title">${escapeHtml(exercise.name)}</span>
            <span class="mini-meta">${escapeHtml(exercise.equipment)} / ${escapeHtml(exercise.target)}</span>
          </span>
        </button>
      `).join("")}</div>`;
    }

    function renderWorkout(workout) {
      if (!workout) return "";
      return `
        <div class="notice">Workout: ${escapeHtml(workout.name)} (${workout.estimated_duration_minutes} min)</div>
        <div class="mini-list">${workout.exercises.map((exercise) => {
          state.exercisesById.set(exercise.id, exercise);
          return `
            <button class="mini-card" data-exercise-id="${escapeHtml(exercise.id)}">
              <img src="${escapeHtml(exercise.image)}" alt="">
              <span>
                <span class="mini-title">${escapeHtml(exercise.name)}</span>
                <span class="mini-meta">${exercise.sets} sets / ${escapeHtml(exercise.reps)} reps / ${exercise.rest_seconds}s rest</span>
              </span>
            </button>
          `;
        }).join("")}</div>
      `;
    }

    async function sendChat() {
      const text = $("chat-input").value.trim();
      if (!text) return;
      $("send-chat").disabled = true;
      state.transcript.push({ role: "user", text });
      $("chat-input").value = "";
      renderTranscript();
      try {
        const body = { message: text };
        if (state.sessionId) body.session_id = state.sessionId;
        const response = await api("/v1/chat", {
          method: "POST",
          body: JSON.stringify(body)
        });
        state.sessionId = response.session_id;
        state.transcript.push({ role: "assistant", payload: response });
      } catch (error) {
        state.transcript.push({
          role: "assistant",
          payload: {
            answer: `Request failed: ${error.message}`,
            warnings: ["Check the API base URL, server readiness, and model provider configuration."]
          }
        });
      } finally {
        $("send-chat").disabled = false;
        persistUiState();
        renderTranscript();
      }
    }

    async function newSession() {
      try {
        const session = await api("/v1/sessions", { method: "POST", body: "{}" });
        state.sessionId = session.id;
        state.transcript = [];
        persistUiState();
        renderTranscript();
      } catch (error) {
        state.transcript.push({
          role: "assistant",
          payload: { answer: `Could not create a session: ${error.message}` }
        });
        renderTranscript();
      }
    }

    async function checkHealth() {
      $("health-state").textContent = "Checking";
      try {
        const health = await api("/health");
        $("health-state").textContent = `${health.database} / ${health.catalog}`;
      } catch (error) {
        $("health-state").textContent = "Unavailable";
      }
    }

    function bindEvents() {
      $("save-api").addEventListener("click", async () => {
        state.apiBase = $("api-base").value.trim().replace(/\/$/, "");
        state.page = 1;
        persistUiState();
        await loadLookups();
        await loadExercises();
      });
      $("check-health").addEventListener("click", checkHealth);
      $("apply-filters").addEventListener("click", () => {
        state.page = 1;
        loadExercises();
      });
      $("clear-filters").addEventListener("click", () => {
        state.filters = {};
        $("muscle-group").value = "";
        $("target").value = "";
        state.page = 1;
        loadLookups().then(loadExercises);
      });
      $("random-exercise").addEventListener("click", showRandomExercise);
      $("prev-page").addEventListener("click", () => {
        if (state.page > 1) {
          state.page -= 1;
          loadExercises();
        }
      });
      $("next-page").addEventListener("click", () => {
        if (state.page < state.totalPages) {
          state.page += 1;
          loadExercises();
        }
      });
      $("send-chat").addEventListener("click", sendChat);
      $("chat-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) sendChat();
      });
      $("new-session").addEventListener("click", newSession);
      $("clear-chat").addEventListener("click", () => {
        state.transcript = [];
        persistUiState();
        renderTranscript();
      });
      $("close-modal").addEventListener("click", () => $("exercise-modal").classList.remove("open"));
      $("exercise-modal").addEventListener("click", (event) => {
        if (event.target.id === "exercise-modal") $("exercise-modal").classList.remove("open");
      });
      document.addEventListener("click", (event) => {
        const chip = event.target.closest("[data-filter-field]");
        if (chip) {
          const field = chip.dataset.filterField;
          const value = chip.dataset.filterValue;
          state.filters[field] = state.filters[field] === value ? "" : value;
          if (!state.filters[field]) delete state.filters[field];
          state.page = 1;
          loadLookups().then(loadExercises);
          return;
        }
        const card = event.target.closest("[data-exercise-id]");
        if (card) {
          const exercise = state.exercisesById.get(card.dataset.exerciseId);
          if (exercise) openExercise(exercise);
        }
      });
    }

    async function init() {
      $("api-base").value = state.apiBase;
      $("limit").value = String(state.limit);
      $("muscle-group").value = state.filters.muscle_group || "";
      $("target").value = state.filters.target || "";
      $("limit").addEventListener("change", () => {
        state.limit = Number($("limit").value);
        state.page = 1;
        loadExercises();
      });
      bindEvents();
      renderTranscript();
      try {
        await loadLookups();
        await loadExercises();
        await checkHealth();
      } catch (error) {
        $("catalog-status").textContent = error.message;
      }
    }

    init();
  </script>
</body>
</html>
